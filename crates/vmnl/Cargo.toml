[package]
name    = "vmnl"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
readme = "../../README.md"
description = "VMNL public API crate."
keywords = ["vulkan", "graphics", "windowing", "rendering", "audio"]
categories = ["graphics", "rendering", "game-development"]

[features]
default = ["graphics"]
graphics = ["dep:vmnl-graphics"]
audio = ["dep:vmnl_audio"]

[dependencies]
vmnl-graphics = { path = "../vmnl_graphics", version = "0.1.0", optional = true }
vmnl_audio = { path = "../vmnl_audio", version = "0.1.0", optional = true }

[lints]
workspace = true
