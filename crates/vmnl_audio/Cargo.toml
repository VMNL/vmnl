[package]
name = "vmnl_audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
description = "VMNL audio wrapper"
keywords = ["miniaudio", "sound", "music"]
categories = ["audio"]

[lib]
doctest = false

[dependencies]
thiserror = "1.0"

hound = "3.5"
lewton = "0.10"
minimp3 = "0.5"
claxon = "0.4"

parking_lot = "0.12"
crossbeam-queue = "0.3"

arc-swap = "1.9.2"
cpal = "0.18.2"

miniaudio = { version = "0.10", features = ["ma-enable-vorbis"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true