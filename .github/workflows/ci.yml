name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: "Quality"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.87.0
          components: rustfmt, clippy
      - name: Check formatting
        run: |
          cargo fmt --all --check
          rustfmt --edition 2021 --check tests/api/facade_features.rs
      - name: Restore Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libshaderc-dev libasound2-dev pkg-config cmake git python3 ninja-build build-essential \
            libvulkan-dev vulkan-tools wayland-protocols \
            libwayland-dev libxkbcommon-dev xorg-dev
      - name: Run Clippy
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          python3 tools/test_facade_features.py --clippy

  audio:
    name: "Audio: ${{ matrix.name }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-14
          - name: Windows
            runner: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.87.0
      - name: Restore Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - name: Compile audio tests including native backend probes
        run: cargo test -p vmnl_audio --tests --no-run --locked
      - name: Run device-independent audio tests
        run: cargo test -p vmnl_audio --test audio --locked
      - name: Check isolated audio-only and empty facade clients
        run: python3 tools/test_facade_features.py --case empty --case audio

  validation:
    name: "Validation: ${{ matrix.name }}"
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VMNL_CI_ARTIFACT_DIR: ${{ github.workspace }}/target/joystick-artifacts
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            backend: ""
          - name: macOS
            runner: macos-14
            backend: cocoa
          - name: Windows
            runner: windows-2022
            backend: win32
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.87.0
      - name: Restore Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Install Linux dependencies and display servers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libshaderc-dev libasound2-dev pkg-config cmake git python3 ninja-build build-essential \
            libvulkan-dev vulkan-tools mesa-vulkan-drivers wayland-protocols \
            libwayland-dev libxkbcommon-dev xorg-dev \
            weston xvfb xauth openbox x11-utils acl
      - name: Build workspace
        run: cargo build --workspace --all-targets --locked
      - name: Run Unit Tests
        run: >-
          cargo test --workspace --lib --exclude vmnl-api-tests --exclude vmnl-gpu-tests
          --exclude vmnl-platform-tests --exclude vmnl-smoke-tests --locked
      - name: Run API Tests
        run: cargo test -p vmnl-api-tests --locked
      - name: Test isolated facade feature combinations
        run: python3 tools/test_facade_features.py
      - name: Run Smoke Tests
        run: cargo run -p vmnl-smoke-tests --locked
      - name: Run portable platform tests
        run: cargo test -p vmnl-platform-tests --locked
      - name: Test Wayland under Weston/Xvfb with Pixman
        if: runner.os == 'Linux'
        env:
          VMNL_PLATFORM_ARTIFACT_DIR: ${{ github.workspace }}/target/platform-artifacts
        run: |
          mkdir -p target/platform-artifacts
          export DISPLAY=:98
          Xvfb "$DISPLAY" -screen 0 1280x720x24 -nolisten tcp \
            >target/wayland-xvfb.log 2>&1 &
          wayland_xvfb_pid=$!
          trap 'kill "$wayland_xvfb_pid" 2>/dev/null || true' EXIT
          for _ in {1..40}; do
            xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break
            if ! kill -0 "$wayland_xvfb_pid"; then
              cat target/wayland-xvfb.log
              exit 1
            fi
            sleep 0.25
          done
          if ! xdpyinfo -display "$DISPLAY" >/dev/null; then
            cat target/wayland-xvfb.log
            exit 1
          fi
          openbox >target/wayland-openbox.log 2>&1 &
          wayland_openbox_pid=$!
          trap 'kill "$wayland_openbox_pid" "$wayland_xvfb_pid" 2>/dev/null || true' EXIT
          for _ in {1..40}; do
            xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q 'window id' && break
            kill -0 "$wayland_openbox_pid"
            sleep 0.25
          done
          xprop -root _NET_SUPPORTING_WM_CHECK | grep -q 'window id'
          runtime_dir="$RUNNER_TEMP/vmnl-weston-runtime"
          mkdir -p "$runtime_dir"
          chmod 700 "$runtime_dir"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export WAYLAND_DISPLAY=wayland-vmnl
          weston --backend=x11 --renderer=pixman --no-config \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 >target/weston.log 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" "$wayland_openbox_pid" "$wayland_xvfb_pid" 2>/dev/null || true' EXIT
          for _ in {1..40}; do
            [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break
            if ! kill -0 "$weston_pid"; then
              cat target/weston.log
              exit 1
            fi
            sleep 0.25
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
            cat target/weston.log
            exit 1
          fi
          VMNL_PLATFORM_TEST_BACKEND=wayland \
            cargo test -p vmnl-platform-tests --locked \
              --test backend_contract selected_backend_contract -- \
              --ignored --exact --nocapture
      - name: Test X11 under Xvfb with Openbox
        if: runner.os == 'Linux'
        env:
          VMNL_PLATFORM_ARTIFACT_DIR: ${{ github.workspace }}/target/platform-artifacts
        run: |
          mkdir -p target/platform-artifacts
          export DISPLAY=:99
          Xvfb "$DISPLAY" -screen 0 1280x720x24 -nolisten tcp >target/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for _ in {1..40}; do
            xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break
            kill -0 "$xvfb_pid"
            sleep 0.25
          done
          xdpyinfo -display "$DISPLAY" >/dev/null
          # The distro Print binding grabs the physical key before GLFW receives it.
          # Remove only this binding in a temporary config; retain the input fixture.
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse('/etc/xdg/openbox/rc.xml')
          ns = {'ob': 'http://openbox.org/3.4/rc'}
          keyboard = tree.find('ob:keyboard', ns)
          assert keyboard is not None
          for binding in list(keyboard):
              if binding.tag == '{http://openbox.org/3.4/rc}keybind' and binding.get('key') == 'Print':
                  print('Removing Openbox binding:', ET.tostring(binding, encoding='unicode'))
                  keyboard.remove(binding)
          tree.write('target/openbox-input.xml', encoding='utf-8', xml_declaration=True)
          PY
          # Openbox changes cwd to the home directory before loading this file.
          openbox --config-file "$GITHUB_WORKSPACE/target/openbox-input.xml" >target/openbox.log 2>&1 &
          openbox_pid=$!
          trap 'kill "$openbox_pid" "$xvfb_pid" 2>/dev/null || true' EXIT
          for _ in {1..40}; do
            xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q 'window id' && break
            kill -0 "$openbox_pid"
            sleep 0.25
          done
          xprop -root _NET_SUPPORTING_WM_CHECK | grep -q 'window id'
          VMNL_PLATFORM_TEST_BACKEND=x11 \
            cargo test -p vmnl-platform-tests --locked \
              --test backend_contract selected_backend_contract -- \
              --ignored --exact --nocapture
      - name: Prepare owned joystick fixture access on disposable runner
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$VMNL_CI_ARTIFACT_DIR"
          sudo modprobe uinput
          sudo udevadm settle --timeout=10
          getfacl -p /dev/uinput >"$VMNL_CI_ARTIFACT_DIR/uinput-before.acl"
          sudo setfacl -m "u:$(id -u):rw" /dev/uinput
          # Grant only new nodes belonging to this fixture, never unrelated input devices.
          sudo mkdir -p /run/udev/rules.d
          printf 'SUBSYSTEM=="input", KERNEL=="event*", ATTRS{name}=="VMNL virtual joystick *", ATTRS{id/vendor}=="f00d", ATTRS{id/product}=="0094", OWNER="%s", MODE="0600"\n' "$(id -u)" \
            | sudo tee /run/udev/rules.d/99-vmnl-joystick.rules >/dev/null
          sudo udevadm control --reload-rules
      - name: Test joystick x11 runtime
        if: runner.os == 'Linux'
        timeout-minutes: 20
        env:
          VMNL_CI_BACKEND: x11
          VMNL_CI_MODE: runtime
          VMNL_CI_ARTIFACT_DIR: ${{ github.workspace }}/target/joystick-artifacts/x11-runtime
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24 -nolisten tcp' \
            bash tools/joystick_ci_display.sh
      - name: Test joystick wayland runtime
        if: runner.os == 'Linux'
        timeout-minutes: 20
        env:
          VMNL_CI_BACKEND: wayland
          VMNL_CI_MODE: runtime
          VMNL_CI_ARTIFACT_DIR: ${{ github.workspace }}/target/joystick-artifacts/wayland-runtime
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24 -nolisten tcp' \
            bash tools/joystick_ci_display.sh
      - name: Select software Vulkan driver explicitly
        id: joystick-vulkan
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          drivers = list(Path('/usr/share/vulkan/icd.d').glob('lvp_icd*.json'))
          if len(drivers) != 1:
              raise SystemExit('Exactly one lavapipe ICD is required; no implicit fallback')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'icd={drivers[0]}\n')
          PY
      - name: Test joystick x11 window
        if: runner.os == 'Linux'
        timeout-minutes: 20
        env:
          VMNL_CI_BACKEND: x11
          VMNL_CI_MODE: window
          VMNL_CI_ARTIFACT_DIR: ${{ github.workspace }}/target/joystick-artifacts/x11-window
          VK_DRIVER_FILES: ${{ steps.joystick-vulkan.outputs.icd }}
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24 -nolisten tcp' \
            bash tools/joystick_ci_display.sh
      - name: Test joystick wayland window
        if: runner.os == 'Linux'
        timeout-minutes: 20
        env:
          VMNL_CI_BACKEND: wayland
          VMNL_CI_MODE: window
          VMNL_CI_ARTIFACT_DIR: ${{ github.workspace }}/target/joystick-artifacts/wayland-window
          VK_DRIVER_FILES: ${{ steps.joystick-vulkan.outputs.icd }}
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24 -nolisten tcp' \
            bash tools/joystick_ci_display.sh
      - name: Restore joystick fixture access
        if: always() && runner.os == 'Linux'
        run: |
          # Attempt ACL restoration even if removing or reloading the rule fails.
          cleanup_status=0
          sudo rm -f /run/udev/rules.d/99-vmnl-joystick.rules || cleanup_status=1
          sudo udevadm control --reload-rules || cleanup_status=1
          if [[ -f "$VMNL_CI_ARTIFACT_DIR/uinput-before.acl" ]]; then
            sudo setfacl --restore="$VMNL_CI_ARTIFACT_DIR/uinput-before.acl" || cleanup_status=1
            if getfacl -p /dev/uinput >"$VMNL_CI_ARTIFACT_DIR/uinput-after.acl"; then
              diff -u "$VMNL_CI_ARTIFACT_DIR/uinput-before.acl" "$VMNL_CI_ARTIFACT_DIR/uinput-after.acl" || cleanup_status=1
            else
              cleanup_status=1
            fi
          fi
          exit "$cleanup_status"
      - name: Upload joystick evidence and display diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: joystick-linux-${{ github.run_attempt }}
          path: target/joystick-artifacts/
          if-no-files-found: error
      - name: Run native platform probes experimentally
        if: runner.os != 'Linux'
        continue-on-error: true
        env:
          VMNL_PLATFORM_ARTIFACT_DIR: ${{ github.workspace }}/target/platform-artifacts
          VMNL_PLATFORM_TEST_BACKEND: ${{ matrix.backend }}
        run: >-
          cargo test -p vmnl-platform-tests --locked
          --test backend_contract selected_backend_contract
          -- --ignored --exact --nocapture
      - name: Upload Linux platform records
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: platform-linux-${{ github.run_attempt }}
          path: |
            target/platform-artifacts/*.jsonl
            target/wayland-xvfb.log
            target/wayland-openbox.log
            target/weston.log
            target/xvfb.log
            target/openbox.log
            target/openbox-input.xml
          if-no-files-found: error
      - name: Upload experimental platform records
        if: always() && runner.os != 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: platform-${{ matrix.backend }}-${{ github.run_attempt }}
          path: target/platform-artifacts/*.jsonl
          if-no-files-found: warn

  documentation:
    name: "Documentation"
    needs: [validation, audio]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.87.0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: nightly-2026-03-12
          profile: minimal
      - name: Restore Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Restore API documentation tools
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target/api-tools
          key: ${{ runner.os }}-${{ runner.arch }}-api-doc-tools-${{ hashFiles('tools/api_docs_tools.sh') }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libshaderc-dev libasound2-dev pkg-config cmake git python3 ninja-build build-essential \
            libvulkan-dev vulkan-tools wayland-protocols \
            libwayland-dev libxkbcommon-dev xorg-dev
      - name: Install pinned API documentation tools
        run: |
          ./tools/api_docs_tools.sh
          echo "$GITHUB_WORKSPACE/target/api-tools/bin" >> "$GITHUB_PATH"
      - name: Build Rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo +1.87.0 doc --workspace --no-deps --locked
      - name: Run doctests
        run: cargo +1.87.0 test --workspace --all-features --doc --locked
      - name: Build public facade
        run: cargo +1.87.0 build -p vmnl --locked
      - name: Check API documentation
        env:
          RUSTUP_TOOLCHAIN: 1.87.0
        run: just _docs-api-check
