name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: "Formatting"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.87.0
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: "Clippy"
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.87.0
          components: clippy
      - name: Restore Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libshaderc-dev pkg-config cmake git python3 ninja-build build-essential \
            libvulkan-dev vulkan-tools libglfw3-dev \
            libwayland-dev libxkbcommon-dev xorg-dev
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  build:
    name: "Build: ${{ matrix.name }}"
    needs: clippy
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-14
          - name: Windows
            runner: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.87.0
      - name: Restore Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libshaderc-dev pkg-config cmake git python3 ninja-build build-essential \
            libvulkan-dev vulkan-tools libglfw3-dev \
            libwayland-dev libxkbcommon-dev xorg-dev
      - name: Build workspace
        run: cargo build --workspace --all-targets --locked

  headless_tests:
    name: "Headless Tests: ${{ matrix.name }}"
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-14
          - name: Windows
            runner: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.87.0
      - name: Restore Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libshaderc-dev pkg-config cmake git python3 ninja-build build-essential \
            libvulkan-dev vulkan-tools libglfw3-dev \
            libwayland-dev libxkbcommon-dev xorg-dev
      - name: Run Unit Tests
        run: >-
          cargo test --workspace --lib --exclude vmnl-api-tests --exclude vmnl-gpu-tests
          --exclude vmnl-smoke-tests --locked
      - name: Run API Tests
        run: cargo test -p vmnl-api-tests --locked
      - name: Run Smoke Tests
        run: cargo run -p vmnl-smoke-tests --locked

  documentation:
    name: "Documentation"
    needs: headless_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.87.0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: nightly-2026-03-12
          profile: minimal
      - name: Restore Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libshaderc-dev pkg-config cmake git python3 ninja-build build-essential \
            libvulkan-dev vulkan-tools libglfw3-dev \
            libwayland-dev libxkbcommon-dev xorg-dev
      - name: Install pinned API documentation tools
        run: |
          tools_dir="$RUNNER_TEMP/vmnl-api-tools"
          mkdir -p "$tools_dir"

          mdbook_archive="$RUNNER_TEMP/mdbook.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$mdbook_archive" \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          echo '3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  '"$mdbook_archive" | sha256sum --check
          tar -xzf "$mdbook_archive" -C "$tools_dir"

          lychee_archive="$RUNNER_TEMP/lychee.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$lychee_archive" \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz
          echo '73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5  '"$lychee_archive" | sha256sum --check
          tar -xzf "$lychee_archive" -C "$tools_dir" --strip-components=1

          echo "$tools_dir" >> "$GITHUB_PATH"
          cargo +nightly-2026-03-12 install cargo-public-api --version 0.52.0 --locked
      - name: Build Rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo +1.87.0 doc --workspace --no-deps --locked
      - name: Run doctests
        run: cargo +1.87.0 test --workspace --all-features --doc --locked
      - name: Build public facade
        run: cargo +1.87.0 build -p vmnl --locked
      - name: Check API documentation
        env:
          RUSTUP_TOOLCHAIN: 1.87.0
        run: just _docs-api-check
