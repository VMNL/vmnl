backends = [{ name = "wayland", status = "conditional", conditions = "Hint is set before initialization; the probe disables libdecor and Weston supplies a fake input seat.", behavior = "Selects the Wayland backend and decoration strategy used by the next initialization.", errors = ["GLFW_INVALID_ENUM", "GLFW_INVALID_VALUE"], sentinel = "No-op for invalid hint", source = "https://www.glfw.org/docs/3.4/group__init.html" }, { name = "x11-win32-cocoa-null", status = "supported", conditions = "A valid platform hint is set before initialization.", behavior = "Selects the requested compiled backend.", errors = ["GLFW_INVALID_ENUM", "GLFW_INVALID_VALUE"], sentinel = "No-op for invalid hint", source = "https://www.glfw.org/docs/3.4/group__init.html" }]
