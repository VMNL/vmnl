[audit]
glfw = "0.62.0"
glfw_sys = "8.0.0"
glfw_c = "3.4.0"
fork_url = "https://github.com/VMNL/glfw-rs"
fork_rev = "eee570b6f0881d49a678ebe8ec32b50c3dcea4de"

# Every entry records at least one source-scoped backend conclusion and either a test identifier or
# an explicit review justification. `unverified` means that VMNL makes no portability guarantee.

[[function]]
c_symbol = "glfwInit"
rust_wrappers = ["glfw::init"]
category = "initialization"
introduced = "1.0"
vmnl_usage = ["Context::new"]
backends = [{ name = "all", status = "conditional", conditions = "The selected backend and its runtime dependencies are available.", behavior = "Initializes GLFW or returns failure after invoking the error callback.", errors = ["GLFW_PLATFORM_UNAVAILABLE", "GLFW_PLATFORM_ERROR"], sentinel = "GLFW_FALSE", source = "https://www.glfw.org/docs/3.4/group__init.html" }]
proofs = ["test:native_window::null_backend_creates_a_no_api_window_without_abort"]

[[function]]
